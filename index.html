<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Video → SRT</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="shell">

    <section class="hero">
      <div class="pill">AI SUBTITLE MAKER</div>

      <h1>
        Video ကို Upload တင်ပြီး<br>
        <span>SRT ထုတ်ပါ</span>
      </h1>

      <p>
        Video / Audio ဖိုင်တင်ပါ။ AI က စာသားဖော်ထုတ်ပြီး
        သင်ရွေးထားတဲ့ဘာသာစကားနဲ့ SRT ဖိုင်ထုတ်ပေးပါမယ်။
      </p>
    </section>

    <section class="card">

      <form id="form">

        <label class="drop" id="dropZone">
         <input
  type="file"
  id="media"
  name="media"
  accept="video/*,.mp4,.mov,.webm,.mkv,.avi,.mp3,.m4a,.wav"
/>

          <div class="upload-icon">↑</div>

          <strong id="fileTitle">
            Video / Audio Upload
          </strong>

          <small id="fileHint">
            MP4, MOV, WEBM, MP3, M4A, WAV • Max 500MB
          </small>
        </label>

        <div class="grid">

          <label>
            Source language

            <select id="sourceLanguage" name="sourceLanguage">
              <option>Auto detect</option>
              <option>Chinese</option>
              <option>English</option>
              <option>Thai</option>
              <option>Myanmar (Burmese)</option>
              <option>Japanese</option>
              <option>Korean</option>
            </select>
          </label>

          <label>
            SRT language

            <select id="targetLanguage" name="targetLanguage">
              <option selected>Myanmar (Burmese)</option>
              <option>English</option>
              <option>Chinese</option>
              <option>Thai</option>
              <option>Japanese</option>
              <option>Korean</option>
            </select>
          </label>

        </div>

        <button id="generateBtn" type="submit">
          Generate SRT
        </button>

      </form>

      <!-- STATUS -->
      <div id="status" class="status hidden"></div>

      <!-- REAL PROGRESS -->
      <section id="progressBox" class="progress-box hidden">

        <div class="progress-top">
          <strong id="progressTitle">
            Preparing...
          </strong>

          <strong id="progressPercent">
            0%
          </strong>
        </div>

        <div class="progress-track">
          <div
            id="progressBar"
            class="progress-bar"
            style="width: 0%"
          ></div>
        </div>

        <small id="progressMessage">
          Starting subtitle generation...
        </small>

      </section>

      <!-- RESULT -->
      <section id="result" class="result hidden">

        <div class="result-head">

          <div>
            <small>RESULT</small>

            <h2>
              Your SRT is ready
            </h2>
          </div>

          <button
            id="downloadBtn"
            class="secondary"
            type="button"
          >
            Download .srt
          </button>

        </div>

        <textarea
          id="output"
          spellcheck="false"
        ></textarea>

        <button
          id="copyBtn"
          class="ghost"
          type="button"
        >
          Copy SRT Text
        </button>
        <button
          id="burnBtn"
          type="button"
          disabled
        >
          Burn Subtitles into MP4
        </button>

        <p id="burnStatus" class="status hidden"></p>
      </section>

    </section>

    <p class="footer">
      API key ကို browser ထဲမထည့်ဘဲ server-side မှာပဲ သိမ်းထားပါတယ်။
    </p>

  </main>

  <script src="app.js"></script>
</body>
</html>
